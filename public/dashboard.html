<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEO-Hosting.com - لوحة التحكم</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #182235;
      --row-bg: #1e293b;
      --row-hover: #26344b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --gray-btn: #475569;
      --gray-hover: #334155;
      --red: #dc2626;
      --red-hover: #b91c1c;
      --editor-bg: #141b29;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }

    .top-brand {
      background: #0b1120;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .sub-nav {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }

    .nav-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: #60a5fa;
      border-bottom-color: #3b82f6;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px;
    }

    .server-switcher {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .power-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      justify-content: flex-end;
    }

    button, input, select, textarea { font-family: inherit; }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover { background: var(--blue-hover); }
    button.gray { background: var(--gray-btn); }
    button.gray:hover { background: var(--gray-hover); }
    button.red { background: var(--red); }
    button.red:hover { background: var(--red-hover); }
    button.sm { padding: 6px 11px; font-size: 12px; }

    input, select, textarea {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .console-screen {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 290px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      direction: ltr;
      text-align: left;
    }

    .console-cmd {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      direction: ltr;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    .stat-box {
      background: #334155;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-label { font-size: 11.5px; color: #cbd5e1; }
    .stat-val { font-size: 14px; font-weight: 700; color: #fff; margin-top: 2px; }

    .files-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--muted);
      direction: ltr;
      text-align: left;
    }

    .breadcrumb span { color: #e2e8f0; font-weight: 600; }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }

    .file-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--row-bg);
      border-radius: 6px;
      padding: 10px 12px;
      transition: 0.12s;
    }

    .file-row:hover { background: var(--row-hover); }

    .file-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      direction: ltr;
      text-align: left;
      padding-left: 8px;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 500;
      color: #f8fafc;
      word-break: break-all;
    }

    .file-size {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .dots-btn {
      background: transparent;
      color: #cbd5e1;
      padding: 4px 8px;
      font-size: 18px;
      line-height: 1;
      border-radius: 6px;
    }

    .dots-btn:hover { background: rgba(255, 255, 255, 0.08); }

    .dots-menu {
      position: absolute;
      left: 10px;
      top: 42px;
      z-index: 40;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 155px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .dots-menu button {
      width: 100%;
      text-align: right;
      background: transparent;
      color: var(--text);
      border-radius: 0;
      padding: 9px 12px;
      font-size: 12.5px;
      display: block;
    }

    .dots-menu button:hover { background: #1e293b; }
    .dots-menu button.del-item { color: #f87171; }

    .editor-path {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #cbd5e1;
      direction: ltr;
      text-align: left;
    }

    .code-editor {
      width: 100%;
      min-height: 360px;
      background: var(--editor-bg);
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.55;
      direction: ltr;
      text-align: left;
      resize: vertical;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: right; }
    th { color: var(--muted); }
    .msg { font-size: 12.5px; color: #93c5fd; min-height: 18px; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="top-brand">
    <div class="brand-title">KEO-Hosting.com</div>
    <div class="top-meta">
      <span id="userInfo">جاري التحميل...</span>
      <button class="gray sm" onclick="logout()">خروج</button>
    </div>
  </div>

  <nav class="sub-nav">
    <button class="nav-tab active" id="navConsole" onclick="switchSection('console')">Console</button>
    <button class="nav-tab" id="navFiles" onclick="switchSection('files')">Files</button>
    <button class="nav-tab hidden" id="navUsers" onclick="switchSection('users')">Users</button>
  </nav>

  <div class="wrap">
    <div class="server-switcher">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:1;">
        <select id="serverSelect" onchange="onServerChange()" style="max-width:260px;"></select>
        <button class="gray sm hidden" id="toggleAllBtn" onclick="toggleAllServers()">عرض الكل</button>
      </div>
      <form id="createServerForm" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <input type="text" id="newServerName" placeholder="اسم سيرفر جديد..." style="width:165px;" required />
        <input type="text" id="newStartupFile" placeholder="index.js" style="width:105px;" />
        <button type="submit" class="sm">إنشاء سيرفر</button>
      </form>
    </div>
    <div id="createServerMsg" class="msg" style="margin-bottom:8px;"></div>

    <section id="sec-console">
      <div class="power-bar">
        <button class="sm" onclick="powerAction('start')">Start</button>
        <button class="gray sm" onclick="powerAction('restart')">Restart</button>
        <button class="red sm" onclick="powerAction('stop')">Stop</button>
      </div>

      <div id="consoleOutput" class="console-screen"></div>

      <form id="consoleForm" class="console-cmd">
        <input type="text" id="consoleInput" placeholder="> Type a command..." />
        <button type="submit" class="sm">Send</button>
      </form>

      <div class="stats-grid">
        <div class="stat-box">
          <div>📡</div>
          <div>
            <div class="stat-label">Status</div>
            <div id="statStatus" class="stat-val">offline</div>
          </div>
        </div>
        <div class="stat-box">
          <div>⏱️</div>
          <div>
            <div class="stat-label">Uptime</div>
            <div id="statUptime" class="stat-val">0s</div>
          </div>
        </div>
        <div class="stat-box">
          <div>⚡</div>
          <div>
            <div class="stat-label">CPU Limit</div>
            <div id="statCpu" class="stat-val">150%</div>
          </div>
        </div>
        <div class="stat-box">
          <div>🧠</div>
          <div>
            <div class="stat-label">Memory / Disk</div>
            <div id="statStorage" class="stat-val">0 / 5120 MB</div>
          </div>
        </div>
        <div class="stat-box">
          <div>📁</div>
          <div>
            <div class="stat-label">Startup File</div>
            <div id="statStartup" class="stat-val">index.js</div>
          </div>
        </div>
        <div class="stat-box">
          <div>👤</div>
          <div>
            <div class="stat-label">Owner</div>
            <div id="statOwner" class="stat-val">-</div>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-files" class="hidden">
      <div id="filesBrowserView">
        <div class="files-toolbar">
          <div class="breadcrumb">/home / <span>container</span> <span id="storageBadge"></span></div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="sm" onclick="promptNewFile()">إنشاء ملف</button>
            <button class="gray sm" onclick="triggerUploadFile()">رفع ملف</button>
            <input type="file" id="uploadFileInput" class="hidden" onchange="handleFileUpload(event)" />
          </div>
        </div>

        <div id="fileListContainer" class="file-list"></div>
        <div id="filesMsg" class="msg"></div>
      </div>

      <div id="fileEditorView" class="hidden">
        <div id="editorFilePath" class="editor-path">/home / container / index.js</div>
        <textarea id="codeEditorArea" class="code-editor" spellcheck="false" placeholder="اكتب الكود هنا..."></textarea>
        <div class="editor-actions">
          <button onclick="saveOpenedFile()">حفظ</button>
          <button class="gray" onclick="backToFilesHome()">الرجوع</button>
          <span id="editorMsg" class="msg" style="margin:0;"></span>
        </div>
      </div>
    </section>

    <section id="sec-users" class="hidden">
      <div class="panel-card">
        <h3 style="margin:0 0 10px;">إضافة عضو جديد</h3>
        <form id="addUserForm" style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="uName" placeholder="اسم المستخدم" style="width:150px;" required />
          <input type="password" id="uPass" placeholder="كلمة السر" style="width:150px;" required />
          <select id="uRole" style="width:120px;">
            <option value="member">member</option>
            <option value="owner">owner</option>
          </select>
          <input type="number" id="uStorage" value="5120" placeholder="MB" style="width:110px;" />
          <input type="number" id="uCpu" value="150" placeholder="CPU %" style="width:100px;" />
          <button type="submit" class="sm">إضافة</button>
        </form>
        <div id="usersMsg" class="msg"></div>
      </div>

      <div class="panel-card" style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>العضو</th>
              <th>الرتبة</th>
              <th>حد السيرفرات</th>
              <th>المساحة (MB)</th>
              <th>CPU (%)</th>
              <th>حفظ</th>
            </tr>
          </thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script>
    const socket = io();
    let currentUser = null;
    let servers = [];
    let activeServerId = null;
    let showAll = false;
    let currentFiles = [];
    let openedFileName = null;
    let openMenuFile = null;
    let uptimeSec = 0;

    setInterval(() => {
      const st = document.getElementById('statStatus').textContent;
      if (st === 'running' || st === 'online') {
        uptimeSec++;
        document.getElementById('statUptime').textContent = formatDuration(uptimeSec);
      }
    }, 1000);

    function formatDuration(sec) {
      const s = Math.max(0, Number(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h > 0) return `${h}h ${m}m ${r}s`;
      if (m > 0) return `${m}m ${r}s`;
      return `${r}s`;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.file-row')) {
        openMenuFile = null;
        renderFileList();
      }
    });

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts
      });
      if (res.status === 401) {
        window.location.href = '/login';
        return null;
      }
      return res;
    }

    async function init() {
      const res = await api('/api/me');
      if (!res) return;
      const data = await res.json();
      currentUser = data.user;

      document.getElementById('userInfo').textContent =
        `${currentUser.username} (${currentUser.role}) • ${currentUser.allocatedStorageMB}MB • ${currentUser.allocatedCpu}%`;

      if (currentUser.role === 'owner') {
        document.getElementById('toggleAllBtn').classList.remove('hidden');
        document.getElementById('navUsers').classList.remove('hidden');
      }

      await loadServers();
    }

    async function loadServers() {
      const q = currentUser.role === 'owner' && showAll ? '?all=1' : '';
      const res = await api(`/api/servers${q}`);
      if (!res) return;
      const data = await res.json();
      servers = data.servers || [];
      renderServerDropdown();

      if (!activeServerId && servers.length > 0) {
        selectServer(servers[0]._id);
      } else if (activeServerId) {
        const cur = servers.find(s => s._id === activeServerId);
        if (cur) updateStats(cur);
      }
    }

    function renderServerDropdown() {
      const sel = document.getElementById('serverSelect');
      if (!servers.length) {
        sel.innerHTML = '<option value="">لا توجد سيرفرات</option>';
        return;
      }
      sel.innerHTML = servers.map(s =>
        `<option value="${s._id}" ${s._id === activeServerId ? 'selected' : ''}>${escapeHtml(s.name)} (${s.status})</option>`
      ).join('');
    }

    function onServerChange() {
      const id = document.getElementById('serverSelect').value;
      if (id) selectServer(id);
    }

    function toggleAllServers() {
      showAll = !showAll;
      document.getElementById('toggleAllBtn').textContent = showAll ? 'سيرفراتي' : 'عرض الكل';
      loadServers();
    }

    async function selectServer(id) {
      activeServerId = id;
      openedFileName = null;
      document.getElementById('fileEditorView').classList.add('hidden');
      document.getElementById('filesBrowserView').classList.remove('hidden');
      renderServerDropdown();

      const srv = servers.find(s => s._id === id);
      if (srv) {
        uptimeSec = srv.runtime?.uptimeSec || 0;
        updateStats(srv);
      }

      document.getElementById('consoleOutput').textContent = '';
      socket.emit('join_server', id);
      await loadFiles();
    }

    function updateStats(srv) {
      document.getElementById('statStatus').textContent = srv.status || 'offline';
      document.getElementById('statStartup').textContent = srv.startupFile || 'index.js';
      document.getElementById('statCpu').textContent = `${srv.cpuLimit || 150}%`;
      document.getElementById('statOwner').textContent = srv.owner?.username || currentUser.username;
      if (srv.runtime?.uptimeSec !== undefined) {
        uptimeSec = srv.runtime.uptimeSec;
      }
      document.getElementById('statUptime').textContent = formatDuration(uptimeSec);
    }

    function switchSection(sec) {
      ['console', 'files', 'users'].forEach(name => {
        document.getElementById(`sec-${name}`).classList.toggle('hidden', name !== sec);
        const tab = document.getElementById(`nav${name.charAt(0).toUpperCase() + name.slice(1)}`);
        if (tab) tab.classList.toggle('active', name === sec);
      });
      if (sec === 'files') {
        backToFilesHome();
        loadFiles();
      }
      if (sec === 'users' && currentUser.role === 'owner') {
        loadUsers();
      }
    }

    document.getElementById('createServerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('createServerMsg');
      const name = document.getElementById('newServerName').value.trim();
      const startupFile = document.getElementById('newStartupFile').value.trim() || 'index.js';
      const res = await api('/api/servers', {
        method: 'POST',
        body: JSON.stringify({ name, startupFile })
      });
      if (!res) return;
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'تعذر إنشاء السيرفر';
        return;
      }
      msg.textContent = 'تم إنشاء السيرفر';
      document.getElementById('newServerName').value = '';
      document.getElementById('newStartupFile').value = '';
      await loadServers();
      if (data.server?._id) selectServer(data.server._id);
    });

    function appendConsoleLine(text) {
      const out = document.getElementById('consoleOutput');
      out.textContent += text;
      out.scrollTop = out.scrollHeight;
    }

    async function powerAction(action) {
      if (!activeServerId) {
        appendConsoleLine('[KEO SYSTEM] اختر سيرفراً أولاً.\n');
        return;
      }
      if (action === 'start') uptimeSec = 0;
      appendConsoleLine(`[KEO SYSTEM] إرسال أمر ${action}...\n`);
      const res = await api(`/api/servers/${activeServerId}/power`, {
        method: 'POST',
        body: JSON.stringify({ action })
      });
      if (!res) return;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        appendConsoleLine(`[KEO ERROR] ${data.error || 'فشل تنفيذ الأمر'}\n`);
      }
      await loadServers();
    }

    document.getElementById('consoleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inp = document.getElementById('consoleInput');
      const cmd = inp.value.trim();
      if (!cmd || !activeServerId) return;
      socket.emit('console_command', { serverId: activeServerId, command: cmd });
      inp.value = '';
    });

    socket.on('console_output', ({ serverId, line }) => {
      if (serverId !== activeServerId) return;
      appendConsoleLine(line);
    });

    socket.on('console_log', ({ serverId, line }) => {
      if (serverId !== activeServerId) return;
      appendConsoleLine(line);
    });

    socket.on('server_status', async ({ serverId, status }) => {
      if (serverId === activeServerId && (status === 'offline' || status === 'starting')) {
        uptimeSec = 0;
        document.getElementById('statUptime').textContent = '0s';
      }
      if (serverId === activeServerId || servers.some(s => s._id === serverId)) {
        await loadServers();
      }
    });

    async function loadFiles() {
      if (!activeServerId) return;
      const res = await api(`/api/servers/${activeServerId}/files`);
      if (!res) return;
      const data = await res.json();
      currentFiles = data.files || [];
      document.getElementById('storageBadge').textContent =
        `• ${data.usedStorageMB ?? 0} / ${data.limitStorageMB ?? 5120} MB`;
      document.getElementById('statStorage').textContent =
        `${data.usedStorageMB ?? 0} / ${data.limitStorageMB ?? 5120} MB`;
      renderFileList();
    }

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KiB`;
      return `${(n / (1024 * 1024)).toFixed(2)} MiB`;
    }

    function renderFileList() {
      const box = document.getElementById('fileListContainer');
      if (!currentFiles.length) {
        box.innerHTML = '<div style="padding:14px; color:#94a3b8; font-size:13px;">لا توجد ملفات بعد. اضغط "إنشاء ملف" أو "رفع ملف".</div>';
        return;
      }

      box.innerHTML = currentFiles.map(f => {
        const name = f.fileName || f.name;
        const size = f.sizeBytes ?? f.size ?? 0;
        const isOpenMenu = openMenuFile === name;
        const icon = name.includes('/') ? '📂' : '📄';
        return `
          <div class="file-row">
            <div class="file-main" onclick="openFileInEditor('${escapeAttr(name)}')">
              <span class="file-name">${icon} ${escapeHtml(name)}</span>
              <span class="file-size">${formatBytes(size)}</span>
            </div>
            <button type="button" class="dots-btn" onclick="toggleDotsMenu(event, '${escapeAttr(name)}')">⋮</button>
            ${isOpenMenu ? `
              <div class="dots-menu">
                <button type="button" onclick="renameFile('${escapeAttr(name)}')">✏️ تغيير الاسم</button>
                <button type="button" onclick="downloadFile('${escapeAttr(name)}')">⬇️ تنزيل</button>
                <button type="button" onclick="archiveFile('${escapeAttr(name)}')">📦 أرشفة</button>
                <button type="button" class="del-item" onclick="deleteFileByName('${escapeAttr(name)}')">🗑️ حذف</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleDotsMenu(e, fileName) {
      e.stopPropagation();
      openMenuFile = openMenuFile === fileName ? null : fileName;
      renderFileList();
    }

    async function openFileInEditor(fileName) {
      openMenuFile = null;
      renderFileList();
      openedFileName = fileName;

      document.getElementById('editorFilePath').textContent = `/home / container / ${fileName}`;
      document.getElementById('codeEditorArea').value = 'جاري تحميل الملف...';
      document.getElementById('editorMsg').textContent = '';

      document.getElementById('filesBrowserView').classList.add('hidden');
      document.getElementById('fileEditorView').classList.remove('hidden');

      const res = await api(`/api/servers/${activeServerId}/files/content?name=${encodeURIComponent(fileName)}`);
      if (!res) return;
      const data = await res.json();
      document.getElementById('codeEditorArea').value = res.ok ? (data.content || '') : '';
      if (!res.ok) document.getElementById('editorMsg').textContent = data.error || 'ملف جديد';
    }

    async function saveOpenedFile() {
      if (!activeServerId || !openedFileName) return;
      const content = document.getElementById('codeEditorArea').value;
      const msg = document.getElementById('editorMsg');
      msg.textContent = 'جاري الحفظ...';

      const res = await api(`/api/servers/${activeServerId}/files/save`, {
        method: 'POST',
        body: JSON.stringify({ fileName: openedFileName, content })
      });
      if (!res) return;
      const data = await res.json();
      msg.textContent = res.ok ? 'تم حفظ الملف بنجاح' : (data.error || 'فشل الحفظ');
      await loadFiles();
    }

    function backToFilesHome() {
      openedFileName = null;
      document.getElementById('fileEditorView').classList.add('hidden');
      document.getElementById('filesBrowserView').classList.remove('hidden');
      loadFiles();
    }

    async function promptNewFile() {
      if (!activeServerId) return;
      const name = prompt('اكتب اسم الملف الجديد (مثال: index.js أو src/bot.js):');
      if (!name || !name.trim()) return;
      const cleanName = name.trim();
      const res = await api(`/api/servers/${activeServerId}/files/save`, {
        method: 'POST',
        body: JSON.stringify({ fileName: cleanName, content: '' })
      });
      if (!res) return;
      await loadFiles();
      openFileInEditor(cleanName);
    }

    function triggerUploadFile() {
      if (!activeServerId) return;
      document.getElementById('uploadFileInput').click();
    }

    async function handleFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file || !activeServerId) return;
      const msg = document.getElementById('filesMsg');
      msg.textContent = 'جاري رفع الملف...';

      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch(`/api/servers/${activeServerId}/files/upload`, {
        method: 'POST',
        body: fd
      });
      e.target.value = '';
      if (res.status === 401) return (window.location.href = '/login');
      const data = await res.json();
      msg.textContent = res.ok ? (data.message || `تم رفع ${file.name}`) : (data.error || 'فشل الرفع');
      await loadFiles();
    }

    async function renameFile(oldName) {
      openMenuFile = null;
      const newName = prompt(`تغيير اسم الملف (${oldName}) إلى:`, oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return renderFileList();

      const res = await api(`/api/servers/${activeServerId}/files/rename`, {
        method: 'POST',
        body: JSON.stringify({ oldName, newName: newName.trim() })
      });
      if (!res) return;
      const data = await res.json();
      document.getElementById('filesMsg').textContent = res.ok ? 'تم تغيير الاسم' : (data.error || 'تعذر تغيير الاسم');
      await loadFiles();
      await loadServers();
    }

    function downloadFile(fileName) {
      openMenuFile = null;
      renderFileList();
      window.location.href = `/api/servers/${activeServerId}/files/download?name=${encodeURIComponent(fileName)}`;
    }

    async function archiveFile(fileName) {
      openMenuFile = null;
      const res = await api(`/api/servers/${activeServerId}/files/archive`, {
        method: 'POST',
        body: JSON.stringify({ fileName })
      });
      if (!res) return;
      const data = await res.json();
      document.getElementById('filesMsg').textContent = res.ok ? (data.message || 'تمت أرشفة الملف') : (data.error || 'تعذرت الأرشفة');
      await loadFiles();
    }

    async function deleteFileByName(fileName) {
      openMenuFile = null;
      if (!confirm(`هل أنت متأكد من حذف ${fileName}؟`)) return renderFileList();

      const res = await api(`/api/servers/${activeServerId}/files?name=${encodeURIComponent(fileName)}`, {
        method: 'DELETE'
      });
      if (!res) return;
      const data = await res.json();
      document.getElementById('filesMsg').textContent = res.ok ? `تم حذف ${fileName}` : (data.error || 'تعذر الحذف');
      await loadFiles();
    }

    async function loadUsers() {
      const res = await api('/api/users');
      if (!res) return;
      const data = await res.json();
      const tbody = document.getElementById('usersTbody');
      tbody.innerHTML = (data.users || []).map(u => `
        <tr>
          <td>${escapeHtml(u.username)}</td>
          <td>${u.role}</td>
          <td><input type="number" min="1" max="2" id="srv_${u._id}" value="${u.maxServers}" style="width:65px;" /></td>
          <td><input type="number" min="256" step="256" id="st_${u._id}" value="${u.allocatedStorageMB}" style="width:95px;" /></td>
          <td><input type="number" min="10" max="1000" id="cpu_${u._id}" value="${u.allocatedCpu}" style="width:80px;" /></td>
          <td><button class="sm" onclick="saveUserAlloc('${u._id}')">حفظ</button></td>
        </tr>
      `).join('');
    }

    async function saveUserAlloc(userId) {
      const res = await api(`/api/users/${userId}/allocations`, {
        method: 'PATCH',
        body: JSON.stringify({
          maxServers: Number(document.getElementById(`srv_${userId}`).value),
          allocatedStorageMB: Number(document.getElementById(`st_${userId}`).value),
          allocatedCpu: Number(document.getElementById(`cpu_${userId}`).value)
        })
      });
      if (!res) return;
      const data = await res.json();
      document.getElementById('usersMsg').textContent = res.ok ? `تم تحديث ${data.user.username}` : (data.error || 'فشل التحديث');
      await loadServers();
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await api('/api/users', {
        method: 'POST',
        body: JSON.stringify({
          username: document.getElementById('uName').value.trim(),
          password: document.getElementById('uPass').value,
          role: document.getElementById('uRole').value,
          allocatedStorageMB: Number(document.getElementById('uStorage').value || 5120),
          allocatedCpu: Number(document.getElementById('uCpu').value || 150),
          maxServers: 2
        })
      });
      if (!res) return;
      const data = await res.json();
      if (res.ok) {
        document.getElementById('usersMsg').textContent = `تمت إضافة ${data.user.username}`;
        document.getElementById('addUserForm').reset();
        loadUsers();
      } else {
        document.getElementById('usersMsg').textContent = data.error || 'تعذر الإضافة';
      }
    });

    async function logout() {
      await api('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
